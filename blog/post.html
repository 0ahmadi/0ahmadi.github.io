<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Post · Ali Ahmadi</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="blog.css" />

  <!-- Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>

  <!-- LaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <!-- Code highlighting -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-light.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-brand" href="../index.html#home">Ali Ahmadi</a>
    <ul class="nav-links">
      <li><a href="../index.html#home">Home</a></li>
      <li><a href="../index.html#about">About</a></li>
      <li><a href="../index.html#projects">Projects</a></li>
      <li><a href="../index.html#quotes">Quotes</a></li>
      <li><a href="../blog.html" class="active-page">Blog</a></li>
    </ul>
  </div>
</nav>

<main>
  <section class="active" style="padding: 3.5rem 0 4rem;">
    <a class="post-back" href="../blog.html">&larr; Back to Blog</a>
    <div id="post-header" class="post-header">
      <p class="post-loading">Loading…</p>
    </div>
    <article id="post-body" class="post-body"></article>
  </section>
</main>

<footer>
  <p>© 2025 Ali Ahmadi Roghabadi</p>
</footer>

<script src="blog.js"></script>
<script>
  (async function () {
    const params = new URLSearchParams(location.search);
    const slug = params.get('post');
    const headerEl = document.getElementById('post-header');
    const bodyEl = document.getElementById('post-body');

    if (!slug) {
      headerEl.innerHTML = '<p class="post-error">No post specified.</p>';
      return;
    }

    try {
      const res = await fetch(`posts/${slug}.md`);
      if (!res.ok) throw new Error('Post not found');
      const raw = await res.text();
      const { meta, body } = parseFrontMatter(raw);

      document.getElementById('page-title').textContent = (meta.title || slug) + ' · Ali Ahmadi';
      headerEl.innerHTML = `
        <h1 class="post-title">${meta.title || slug}</h1>
        <div class="post-meta">
          <span>${meta.date ? formatDate(meta.date) : ''}</span>
          ${meta.tags && meta.tags.length ? meta.tags.map(t => `<span class="post-tag">${t}</span>`).join('') : ''}
        </div>
      `;

      bodyEl.innerHTML = renderMarkdown(body);
      highlightCodeIn(bodyEl);
    } catch (e) {
      headerEl.innerHTML = '<p class="post-error">Could not load this post.</p>';
      console.error(e);
    }
  })();
</script>
</body>
</html>
