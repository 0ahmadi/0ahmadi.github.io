<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog · Ali Ahmadi</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="blog/blog.css" />
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-brand" href="index.html#home">Ali Ahmadi</a>
    <ul class="nav-links">
      <li><a href="index.html#home">Home</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#projects">Projects</a></li>
      <li><a href="index.html#quotes">Quotes</a></li>
      <li><a href="blog.html" class="active-page">Blog</a></li>
    </ul>
  </div>
</nav>

<main>
  <section class="active" style="padding: 3.5rem 0 4rem;">
    <div class="section-header">
      <h2>Blog</h2>
    </div>
    <div id="post-list" class="post-list">
      <p class="post-loading">Loading posts…</p>
    </div>
  </section>
</main>

<footer>
  <p>© 2025 Ali Ahmadi Roghabadi</p>
</footer>

<script src="blog/blog.js"></script>
<script>
  (async function () {
    const listEl = document.getElementById('post-list');
    try {
      const posts = await fetchPostsManifest();
      posts.sort((a, b) => new Date(b.date) - new Date(a.date));

      if (posts.length === 0) {
        listEl.innerHTML = '<p class="post-loading">No posts yet.</p>';
        return;
      }

      listEl.innerHTML = posts.map(p => `
        <article class="post-item">
          <div class="post-item-date">${formatDate(p.date)}</div>
          <h3 class="post-item-title"><a href="blog/post.html?post=${encodeURIComponent(p.slug)}">${p.title}</a></h3>
          <p class="post-item-excerpt">${p.excerpt || ''}</p>
          ${p.tags && p.tags.length ? `<div class="post-item-tags">${p.tags.map(t => `<span class="post-tag">${t}</span>`).join('')}</div>` : ''}
        </article>
      `).join('');
    } catch (e) {
      listEl.innerHTML = '<p class="post-error">Could not load posts.</p>';
      console.error(e);
    }
  })();
</script>
</body>
</html>
