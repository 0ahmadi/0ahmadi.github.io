name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compile the CV with XeLaTeX (required by fontspec)
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          working_directory: cv
          latexmk_use_xelatex: true

      # Publish the whole repo, including the generated cv/cv.pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
